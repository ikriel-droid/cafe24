name: claimmate-release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Image tag to publish"
        required: true
        default: "manual"
      environment:
        description: "Target environment bundle"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          file: ./api/Dockerfile
          target: production
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/claimmate-ai-api:${{ inputs.release_tag }}

      - name: Build and push Web image
        uses: docker/build-push-action@v6
        with:
          context: ./web
          file: ./web/Dockerfile
          target: production
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/claimmate-ai-web:${{ inputs.release_tag }}

  publish-deployment-bundle:
    runs-on: ubuntu-latest
    needs: build-and-publish-images
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare deployment bundle
        shell: bash
        run: |
          mkdir -p release-bundle
          cp deploy/docker-compose.${{ inputs.environment }}.yml release-bundle/
          cp -r deploy/nginx release-bundle/nginx
          cp deploy/.env.${{ inputs.environment }}.example release-bundle/
          cp DEPLOYMENT_RUNBOOK.md release-bundle/
          cp INCIDENT_RESPONSE_RUNBOOK.md release-bundle/
          printf "API_IMAGE=ghcr.io/%s/claimmate-ai-api:%s\n" "${{ github.repository_owner }}" "${{ inputs.release_tag }}" > release-bundle/release-images.txt
          printf "WEB_IMAGE=ghcr.io/%s/claimmate-ai-web:%s\n" "${{ github.repository_owner }}" "${{ inputs.release_tag }}" >> release-bundle/release-images.txt

      - name: Upload deployment bundle
        uses: actions/upload-artifact@v4
        with:
          name: claimmate-${{ inputs.environment }}-bundle-${{ inputs.release_tag }}
          path: release-bundle
